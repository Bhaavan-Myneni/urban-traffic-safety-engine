services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traffic_safety
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic_safety"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
